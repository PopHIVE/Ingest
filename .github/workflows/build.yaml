on:
  schedule:
    - cron: '0 18 * * 2,5'
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-22.04
    env:
      RENV_PATHS_CACHE: /home/runner/.local/share/renv/cache
    permissions:
      contents: write
      pull-requests: write
    # bash with pipefail, so a step piped through tee still fails when R does
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          fetch-depth: 0

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gfortran \
            libcurl4-openssl-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            libudunits2-dev \
            libproj-dev \
            libgdal-dev \
            libgeos-dev \
            cmake \
            libnode-dev \
            libfontconfig1-dev

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          use-public-rspm: false

      - name: Cache renv packages
        uses: actions/cache@v4
        with:
          path: ${{ env.RENV_PATHS_CACHE }}
          key: ${{ runner.os }}-renv-3-${{ hashFiles('renv.lock') }}
          restore-keys: ${{ runner.os }}-renv-3-

      - name: Restore Renv
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"))
          if (!requireNamespace("renv", quietly = TRUE)) install.packages("renv")
          renv::restore()
        shell: Rscript {0}
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Custom Package
        # epidatr's V5/cast endpoints (needed here) aren't on CRAN yet, so we
        # install from GitHub. cmu-delphi/epidatr has no "main" branch -- its
        # default branch is "dev" -- so @main 404s every time (not a transient
        # rate limit; renv's curl wraps the 404 as generic "error code 22").
        # Pinned to a commit rather than @dev so a change upstream can't alter
        # what the Delphi sources receive without a commit here (f8951bbe was
        # dev's head on 2026-09-25, the version behind the last good builds).
        # Also retry, since api.github.com calls can still hit GitHub's
        # secondary rate limit on shared Actions runners (rstudio/renv#324).
        run: |
          for attempt in 1 2 3; do
            Rscript -e "renv::install('dissc-yale/dcf'); renv::install('cmu-delphi/epidatr@f8951bbe36a88591af0c0ace5978b8378ad14a0b')" && exit 0
            echo "install failed (attempt $attempt); retrying after backoff"
            sleep $((attempt * 15))
          done
          echo "::error::failed to install GitHub packages after 3 attempts"
          exit 1
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Build Script
        # Output is also kept in a log so the last step can tell whether
        # anything failed: dcf_build() exits 0 even when a source errors.
        run: Rscript scripts/build.R 2>&1 | tee "$RUNNER_TEMP/build.log"
        env:
          DELPHI_EPIDATA_KEY: ${{ secrets.DELPHI_EPIDATA_KEY }}

      - id: diff
        run: |
          if git diff --exit-code; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - if: ${{ steps.diff.outputs.changed == 'true' }}
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -A
          git commit -m "scheduled data build"
          # This build takes ~15-60 minutes, so main frequently moves while it
          # runs (one merged PR is enough). A bare `git push` is then rejected as
          # non-fast-forward and the ENTIRE data build is discarded silently --
          # the job fails, but the next run only re-detects sources whose
          # upstream data changed again, so anything refreshed in the lost run
          # stays stale until its source updates. This is what left
          # nchs_mortality and yrbss stale after the 2026-08-14 and 2026-08-18
          # runs. Rebase onto whatever landed and retry instead. `-X theirs`
          # favors the commit being replayed (our freshly built data) when both
          # sides touched the same generated file.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto origin/main"
            git fetch origin
            git rebase -X theirs origin/main || { git rebase --abort; exit 1; }
          done
          echo "::error::could not push data build after 3 attempts"
          exit 1

      # Runs after the commit so data that did build is still published, then
      # turns the run red if any source or bundle failed. kinsa_ili needs
      # credentials this workflow does not have; the daily workflow runs it.
      - if: ${{ always() }}
        name: Check for failed sources
        run: Rscript scripts/check_build_status.R "$RUNNER_TEMP/build.log" --allow=kinsa_ili
