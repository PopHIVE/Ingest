on:
  schedule:
    # 2am ET (07:00 UTC; during EDT this runs at 3am)
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  update-daily-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      KINSA_EMAIL: ${{ secrets.KINSA_EMAIL }}
      KINSA_PASSWORD: ${{ secrets.KINSA_PASSWORD }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    # bash with pipefail, so a step piped through tee still fails when R does
    defaults:
      run:
        shell: bash
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libudunits2-dev libproj-dev libgdal-dev libgeos-dev
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::dplyr
            any::httr2
            any::purrr
            any::terra
            any::exactextractr
            any::sf
            any::tigris
            any::vroom
            any::tidyr
            any::lubridate
            any::arrow
            any::jsonlite
            any::htmltools
            any::glue
            any::reshape2
            any::tidyverse
            any::tidycensus
            any::zoo
            any::slider
            any::cdlTools
            any::MMWRweek
            any::janitor
            github::dissc-yale/dcf
          cache-version: 1
      # Output is also kept in a log so the last step can tell whether anything
      # failed: dcf_process() exits 0 even when the script it runs errors.
      - run: Rscript -e "dcf::dcf_process('noaa_heat_risk')" 2>&1 | tee -a "$RUNNER_TEMP/process.log"
      - run: Rscript -e "dcf::dcf_process('kinsa_ili')" 2>&1 | tee -a "$RUNNER_TEMP/process.log"
      - run: Rscript -e "dcf::dcf_process('epic_health_alerts')" 2>&1 | tee -a "$RUNNER_TEMP/process.log"
      - run: Rscript -e "dcf::dcf_process('nnds')" 2>&1 | tee -a "$RUNNER_TEMP/process.log"
      - run: Rscript -e "dcf::dcf_process('bundle_respiratory', '.')" 2>&1 | tee -a "$RUNNER_TEMP/process.log"
      - run: Rscript -e "dcf::dcf_process('bundle_sti', '.')" 2>&1 | tee -a "$RUNNER_TEMP/process.log"

      - id: diff
        run: |
          if git diff --exit-code; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      - if: ${{ steps.diff.outputs.changed == 'true' }}
        name: Rebuild documentation and manifest
        run: Rscript scripts/build_docs.R

      - if: ${{ steps.diff.outputs.changed == 'true' }}
        name: Rebuild data table
        run: Rscript scripts/build_data_table.R

      - if: ${{ steps.diff.outputs.changed == 'true' }}
        name: Commit and push
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -A
          git commit -m "scheduled daily data update"
          # Same non-fast-forward hazard as build.yaml: anything merged to main
          # while this job runs makes a bare push fail and throws the data
          # update away. Rebase onto whatever landed and retry.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto origin/main"
            git fetch origin
            git rebase -X theirs origin/main || { git rebase --abort; exit 1; }
          done
          echo "::error::could not push daily data update after 3 attempts"
          exit 1

      # Runs after the commit so data that did build is still published, then
      # turns the run red if any source or bundle failed.
      - if: ${{ always() }}
        name: Check for failed sources
        run: Rscript scripts/check_build_status.R "$RUNNER_TEMP/process.log"
